# Perfil de producción: valores reales llegan por variables de entorno
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}
# 'validate' por defecto; en el primer despliegue con BD vacía usar JPA_DDL_AUTO=update
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.herrera=INFO

# Sin valor por defecto utilizable: el secreto real debe venir del entorno
app.jwt.secret=${JWT_SECRET:}

# Actuator: solo health e info en producción
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
